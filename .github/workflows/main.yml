<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmanuel P.S. Mansaray Online Computer School</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Apply Inter font and set base styles */
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        /* Custom styles for the Study Assistant list output */
        #study-plan-output {
            white-space: pre-wrap; /* Preserve formatting from the API, like new lines */
        }
        #study-plan-output ul {
            list-style-type: disc;
            padding-left: 1.5rem;
        }
        #study-plan-output li {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="min-h-screen font-sans bg-white">

    <!-- Header Component -->
    <header id="header" class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="#" class="flex-shrink-0 font-extrabold text-xl text-indigo-700 tracking-tight">
                    Emmanuel P.S. Mansaray<span class="text-gray-900"> School</span>
                </a>
                <!-- Desktop Navigation -->
                <nav class="hidden md:block">
                    <div class="flex space-x-4">
                        <a href="#home" class="text-gray-600 hover:text-indigo-700 px-3 py-2 rounded-md text-sm font-medium transition duration-150">Home</a>
                        <a href="#courses" class="text-gray-600 hover:text-indigo-700 px-3 py-2 rounded-md text-sm font-medium transition duration-150">Courses</a>
                        <a href="#assistant" class="text-gray-600 hover:text-indigo-700 px-3 py-2 rounded-md text-sm font-medium transition duration-150">Assistant</a>
                        <a href="#why-us" class="text-gray-600 hover:text-indigo-700 px-3 py-2 rounded-md text-sm font-medium transition duration-150">Why Us</a>
                        <a href="#contact" class="text-gray-600 hover:text-indigo-700 px-3 py-2 rounded-md text-sm font-medium transition duration-150">Contact</a>
                    </div>
                </nav>
                <!-- Mobile Menu Button -->
                <button id="mobile-menu-button" class="md:hidden p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500">
                    <svg id="menu-icon-open" class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                    <svg id="menu-icon-close" class="hidden h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white shadow-lg pb-4">
            <div class="px-2 pt-2 space-y-1 sm:px-3">
                <a href="#home" class="block text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 px-3 py-2 rounded-md text-base font-medium">Home</a>
                <a href="#courses" class="block text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 px-3 py-2 rounded-md text-base font-medium">Courses</a>
                <a href="#assistant" class="block text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 px-3 py-2 rounded-md text-base font-medium">Assistant</a>
                <a href="#why-us" class="block text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 px-3 py-2 rounded-md text-base font-medium">Why Us</a>
                <a href="#contact" class="block text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 px-3 py-2 rounded-md text-base font-medium">Contact</a>
            </div>
        </div>
    </header>

    <main>
        <!-- Hero Section -->
        <section id="home" class="pt-20 pb-16 md:pt-32 md:pb-24 bg-gray-50/50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-gray-900 leading-tight">
                    Your Path to Digital Literacy <br class="hidden sm:inline" />Starts <span class="text-indigo-600">Here.</span>
                </h1>
                <p class="mt-4 max-w-3xl mx-auto text-xl text-gray-600">
                    Empowering students with essential computing skills, from basic literacy to practical web design and graphic tools, based in Monrovia, Liberia.
                </p>
                <div class="mt-10 flex flex-col sm:flex-row justify-center space-y-4 sm:space-y-0 sm:space-x-4">
                    <a
                        href="#courses"
                        class="inline-flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-full shadow-lg text-white bg-indigo-600 hover:bg-indigo-700 transition duration-150 transform hover:scale-[1.02]"
                    >
                        Explore Courses
                    </a>
                    <a
                        href="#contact"
                        class="inline-flex items-center justify-center px-8 py-3 border border-indigo-200 text-base font-medium rounded-full shadow-md text-indigo-700 bg-white hover:bg-indigo-50 transition duration-150 transform hover:scale-[1.02]"
                    >
                        Contact Tutor Emmanuel
                    </a>
                </div>
            </div>
        </section>

        <!-- Courses Section -->
        <section id="courses" class="py-16 sm:py-24 bg-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center">
                    <h2 class="text-base font-semibold text-indigo-600 tracking-wide uppercase">Our Curriculum</h2>
                    <p class="mt-2 text-3xl font-extrabold text-gray-900 sm:text-4xl">
                        Skills for the Digital World
                    </p>
                    <p class="mt-4 text-xl text-gray-500">
                        Focused training in basic computing, professional software, and entry-level programming.
                    </p>
                </div>
                <div id="courses-grid" class="mt-12 grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-4">
                    <!-- Course Cards will be inserted here by JavaScript -->
                </div>
            </div>
        </section>

        <!-- Study Assistant Section (Interactive) -->
        <section id="assistant" class="py-16 sm:py-24 bg-gray-50 border-t border-b border-indigo-100">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center mb-12">
                    <h2 class="text-base font-semibold text-indigo-600 tracking-wide uppercase">Powered by Starz University</h2>
                    <p class="mt-2 text-3xl font-extrabold text-gray-900 sm:text-4xl">
                        ✨ Your Personalized Study Assistant
                    </p>
                    <p class="mt-4 text-xl text-gray-500 max-w-2xl mx-auto">
                        Tell us your career goal (e.g., "become a freelance graphic designer" or "get a basic IT job"), and we'll map your course path!
                    </p>
                </div>

                <div class="max-w-3xl mx-auto p-8 bg-white rounded-xl shadow-2xl border border-indigo-200/50">
                    <div class="space-y-4">
                        <label for="career-goal" class="block text-lg font-medium text-gray-700">
                            What is your digital career goal?
                        </label>
                        <textarea
                            id="career-goal"
                            rows="2"
                            placeholder="e.g., I want to build simple marketing websites for small businesses."
                            class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                        ></textarea>
                        <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3 pt-2">
                            <button
                                id="generate-plan-button"
                                class="flex-1 w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-full shadow-md text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 disabled:bg-indigo-400"
                            >
                                <span id="plan-button-text">✨ Generate Personalized Plan</span>
                                <svg id="plan-loading-spinner" class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </button>
                            
                            <button
                                id="read-aloud-button"
                                disabled
                                class="flex-shrink-0 w-full sm:w-auto flex justify-center items-center py-3 px-6 border border-indigo-300 rounded-full shadow-md text-base font-medium text-indigo-700 bg-white hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 disabled:text-gray-400 disabled:bg-gray-100"
                            >
                                <span id="read-aloud-text">🔊 Read Plan Aloud</span>
                                <svg id="audio-loading-spinner" class="hidden animate-spin -ml-1 mr-2 h-5 w-5 text-indigo-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <p id="assistant-error" class="mt-4 text-red-600 text-center hidden"></p>
                    
                    <div id="study-plan-container" class="mt-8 p-6 bg-indigo-50 border-l-4 border-indigo-600 rounded-lg shadow-inner hidden">
                        <h3 class="text-xl font-bold text-indigo-800 mb-3">Suggested Study Path</h3>
                        <div id="study-plan-output" class="text-gray-700 leading-relaxed">
                            <!-- Plan content inserted here -->
                        </div>
                        <audio id="audio-player" controls class="mt-4 w-full rounded-lg hidden"></audio>
                    </div>
                </div>
            </div>
        </section>

        <!-- Why Us Section -->
        <section id="why-us" class="py-16 sm:py-24 bg-indigo-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center">
                    <h2 class="text-base font-semibold text-indigo-600 tracking-wide uppercase">Why Choose Us?</h2>
                    <p class="mt-2 text-3xl font-extrabold text-gray-900 sm:text-4xl">
                        Dedicated Instruction, Real Results
                    </p>
                </div>
                <div id="features-grid" class="mt-12 grid grid-cols-1 gap-8 sm:grid-cols-3">
                    <!-- Features will be inserted here by JavaScript -->
                </div>
            </div>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="py-16 sm:py-24 bg-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="lg:grid lg:grid-cols-2 lg:gap-12">
                    <!-- Contact Info -->
                    <div class="mb-12 lg:mb-0">
                        <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">
                            Ready to Start Learning?
                        </h2>
                        <p class="mt-4 text-lg text-gray-500">
                            Reach out to Tutor Emmanuel directly for enrollment details, custom lesson plans, and pricing inquiries.
                        </p>
                        <div class="mt-8 space-y-4">
                            <div class="flex items-start">
                                <i data-lucide="mail" class="flex-shrink-0 w-6 h-6 text-indigo-600"></i>
                                <div class="ml-3 text-base text-gray-600">
                                    <span class="font-medium text-gray-900">Email:</span>
                                    <p id="contact-email"></p>
                                </div>
                            </div>
                            <div class="flex items-start">
                                <i data-lucide="phone" class="flex-shrink-0 w-6 h-6 text-indigo-600"></i>
                                <div class="ml-3 text-base text-gray-600">
                                    <span class="font-medium text-gray-900">Contact Number:</span>
                                    <p id="contact-phone"></p>
                                </div>
                            </div>
                            <div class="flex items-start">
                                <i data-lucide="map-pin" class="flex-shrink-0 w-6 h-6 text-indigo-600"></i>
                                <div class="ml-3 text-base text-gray-600">
                                    <span class="font-medium text-gray-900">Address:</span>
                                    <p id="contact-address"></p>
                                </div>
                            </div>
                        </div>
                        <p class="mt-8 text-sm text-gray-500 p-3 bg-gray-100 rounded-lg">
                            **Note:** The contact form below is for demonstration purposes. Please use the email or phone number above for direct enrollment.
                        </p>
                    </div>

                    <!-- Contact Form -->
                    <div class="p-8 bg-indigo-50 rounded-xl shadow-2xl">
                        <form id="contact-form" class="space-y-6">
                            <div>
                                <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                                <input type="text" name="name" id="name" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="Your Name" />
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                                <input type="email" name="email" id="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="you@example.com" />
                            </div>
                            <div>
                                <label for="message" class="block text-sm font-medium text-gray-700">Your Inquiry</label>
                                <textarea id="message" name="message" rows="4" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="I'm interested in the Basic Computing course..."></textarea>
                            </div>
                            <button
                                type="submit"
                                id="submit-form-button"
                                class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-full shadow-md text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150"
                            >
                                Send Message
                            </button>
                            <p id="form-status" class="mt-2 text-center text-sm hidden"></p>
                        </form>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-900">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0 text-center md:text-left">
                <p class="text-gray-400 text-sm">
                    &copy; <span id="current-year"></span> Emmanuel P.S. Mansaray Online Computer School. All rights reserved. | Located in Monrovia, Liberia.
                </p>
                <div class="flex space-x-6">
                    <a href="#" class="text-gray-400 hover:text-indigo-400 transition duration-150">Terms</a>
                    <a href="#" class="text-gray-400 hover:text-indigo-400 transition duration-150">Privacy</a>
                </div>
            </div>
        </div>
    </footer>


    <script>
        // --- 1. CONFIGURATION AND HELPER FUNCTIONS ---
        const API_KEY = ""; // Placeholder for Gemini API Key
        const GEMINI_TEXT_MODEL = "gemini-2.5-flash-preview-09-2025";
        const GEMINI_TTS_MODEL = "gemini-2.5-flash-preview-tts";

        const SCHOOL_CONSTANTS = {
            schoolName: "Emmanuel P.S. Mansaray Online Computer School",
            contactInfo: {
                email: "emmanuelmansaray419@gmail.com",
                phone: "+231772062574",
                address: "Chicken Soup Factory, Gradnerville, Monrovia",
                country: "Republic of Liberia",
            },
            mockCourses: [
                { id: 1, icon: 'book-open', title: "Basic Computing Fundamentals", description: "Learn the essential ABCs of computers, operating systems, and file management to start your digital journey.", duration: "4 Weeks", price: "$50", color: "bg-blue-500/10 text-blue-600" },
                { id: 2, icon: 'cpu', title: "Microsoft Office Productivity Suite", description: "Master Word, Excel, and PowerPoint for professional document creation, data analysis, and compelling presentations.", duration: "6 Weeks", price: "$75", color: "bg-green-500/10 text-green-600" },
                { id: 3, icon: 'globe', title: "Web Design Essentials (HTML & CSS)", description: "Get started with web development by learning HTML for structure and CSS for styling and responsive layouts.", duration: "8 Weeks", price: "$120", color: "bg-purple-500/10 text-purple-600" },
                { id: 4, icon: 'award', title: "Graphic Design Basics", description: "Introduction to graphic design principles and tools for creating stunning visual content 
